<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>UNCARD</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--marquee); color:var(--ink); font-family:var(--font-text); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; background:var(--marquee); }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .ink { fill:var(--ink); }
  .butter { fill:var(--butter); }
  .tom { fill:var(--tomato); }
  .paper { fill:var(--paper); }
  .card { rx:var(--radius-card); }
  .tk { rx:var(--radius-sm); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:104px; line-height:.92; font-weight:900; letter-spacing:-.01em; color:var(--ink); }
  .name .dot { color:var(--tomato); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ink 360x232 slab bled off the top and right (the poster's black type) · butter 112x168 bled off the bottom (the studio tint) · paper ticket 200x96 on the slab · tomato 48x48 square on the ground (the full stop) — about 38% of 960x288
  arrangement one tall slab with satellites: the tint left, the full stop bottom right where a sentence would end
  pattern     filmstrip perforations, from "Tickets and filmstrips are the brand's two recurring motifs": paper 12x9 holes at a 30px pitch along the slab's top and bottom, ticket notches cut back to ink
  scales      gutters space-4; pitch from the filmstrip (12px holes every 30px); corners radius-card on the blocks, radius-sm on the ticket; the full stop square like the wordmark's
-->
<rect class="butter card" x="0" y="120" width="112" height="196"/>
<rect class="ink card" x="128" y="-24" width="376" height="232"/>
<rect class="paper" x="144" y="10" width="12" height="9"/>
<rect class="paper" x="174" y="10" width="12" height="9"/>
<rect class="paper" x="204" y="10" width="12" height="9"/>
<rect class="paper" x="234" y="10" width="12" height="9"/>
<rect class="paper" x="264" y="10" width="12" height="9"/>
<rect class="paper" x="294" y="10" width="12" height="9"/>
<rect class="paper" x="324" y="10" width="12" height="9"/>
<rect class="paper" x="354" y="10" width="12" height="9"/>
<rect class="paper" x="384" y="10" width="12" height="9"/>
<rect class="paper" x="414" y="10" width="12" height="9"/>
<rect class="paper" x="444" y="10" width="12" height="9"/>
<rect class="paper" x="144" y="184" width="12" height="9"/>
<rect class="paper" x="174" y="184" width="12" height="9"/>
<rect class="paper" x="204" y="184" width="12" height="9"/>
<rect class="paper" x="234" y="184" width="12" height="9"/>
<rect class="paper" x="264" y="184" width="12" height="9"/>
<rect class="paper" x="294" y="184" width="12" height="9"/>
<rect class="paper" x="324" y="184" width="12" height="9"/>
<rect class="paper" x="354" y="184" width="12" height="9"/>
<rect class="paper" x="384" y="184" width="12" height="9"/>
<rect class="paper" x="414" y="184" width="12" height="9"/>
<rect class="paper" x="444" y="184" width="12" height="9"/>
<rect class="paper tk" x="176" y="52" width="216" height="104"/>
<circle class="ink" cx="176" cy="104" r="12"/>
<circle class="ink" cx="392" cy="104" r="12"/>
<rect class="ink" x="208" y="76" width="96" height="10"/>
<rect class="ink" x="208" y="98" width="152" height="30"/>
<rect class="tom" x="400" y="224" width="48" height="48"/>
</svg>
</div>
<div class="words">
<h1 class="name">UNCARD<span class="dot">.</span></h1>
<p class="tag">A whole little world. Made for one person.</p>
</div>
</div>
</body>
</html>
