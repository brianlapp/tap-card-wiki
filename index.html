<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tapcard Wiki</title>
<meta name="description" content="Human-readable view of the Tapcard agent wiki.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<style>
  :root{
    --bg:#fbfaf9; --panel:#fff; --ink:#1c1a19; --muted:#6b6560; --line:#e6e1dc;
    --accent:#c2410c; --accent-soft:#fff1e9; --code-bg:#f4f1ee;
    --open:#b45309; --open-bg:#fef3c7; --draft:#3f6212; --draft-bg:#ecfccb;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
    :root{--bg:#17161a;--panel:#1e1d22;--ink:#eceaf0;--muted:#a09aa8;--line:#312f38;
      --accent:#fb923c;--accent-soft:#2a1d17;--code-bg:#26242c;
      --open:#fbbf24;--open-bg:#332616;--draft:#a3e635;--draft-bg:#232d14;}
  }}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
      --bg:#17161a;--panel:#1e1d22;--ink:#eceaf0;--muted:#a09aa8;--line:#312f38;
      --accent:#fb923c;--accent-soft:#2a1d17;--code-bg:#26242c;
      --open:#fbbf24;--open-bg:#332616;--draft:#a3e635;--draft-bg:#232d14;}
  }
  :root[data-theme="dark"]{--bg:#17161a;--panel:#1e1d22;--ink:#eceaf0;--muted:#a09aa8;--line:#312f38;
      --accent:#fb923c;--accent-soft:#2a1d17;--code-bg:#26242c;
      --open:#fbbf24;--open-bg:#332616;--draft:#a3e635;--draft-bg:#232d14;}

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:16px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:var(--accent)}

  .shell{display:flex;min-height:100vh;align-items:flex-start}

  /* ---- sidebar ---- */
  .side{width:280px;flex:none;border-right:1px solid var(--line);background:var(--panel);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:24px 16px}
  .brand{display:block;text-decoration:none;color:inherit;padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .brand b{display:block;font-size:17px;letter-spacing:-.01em}
  .brand span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
  .grp{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);padding:16px 8px 6px}
  .side a.nav{display:block;text-decoration:none;color:var(--ink);font-size:14.5px;
    padding:7px 10px;border-radius:7px;margin-bottom:1px}
  .side a.nav:hover{background:var(--accent-soft)}
  .side a.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .side a.nav small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:1px}
  .side a.nav.on small{color:var(--muted)}

  .foot{margin-top:24px;padding:14px 10px 0;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--muted);line-height:1.55}
  .foot a{color:var(--muted)}

  /* ---- main ---- */
  .main{flex:1;min-width:0;padding:48px 56px 96px;max-width:860px}
  .bar{display:none}
  .crumb{font-size:12.5px;color:var(--muted);margin-bottom:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .raw{float:right;font-size:12.5px;text-decoration:none;border:1px solid var(--line);
    padding:3px 10px;border-radius:999px;color:var(--muted);background:var(--panel)}
  .raw:hover{color:var(--accent);border-color:var(--accent)}

  .doc h1{font-size:30px;line-height:1.2;letter-spacing:-.02em;margin:.2em 0 .5em}
  .doc h2{font-size:20px;letter-spacing:-.01em;margin:1.9em 0 .6em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
  .doc h3{font-size:16px;margin:1.5em 0 .4em}
  .doc p,.doc li{overflow-wrap:break-word}
  .doc li{margin:.25em 0}
  .doc code{background:var(--code-bg);padding:.15em .4em;border-radius:5px;
    font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  .doc pre{background:var(--code-bg);padding:16px;border-radius:10px;overflow-x:auto;border:1px solid var(--line)}
  .doc pre code{background:none;padding:0;font-size:13px}
  .doc blockquote{margin:1em 0;padding:.4em 1em;border-left:3px solid var(--accent);color:var(--muted)}
  .doc hr{border:0;border-top:1px solid var(--line);margin:2.2em 0}
  .doc table{border-collapse:collapse;width:100%;margin:1.1em 0;font-size:14.5px;display:block;overflow-x:auto}
  .doc th,.doc td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
  .doc th{background:var(--code-bg);font-weight:650}
  .doc input[type=checkbox]{margin-right:.5em}

  .pill{display:inline-block;font-size:12px;font-weight:650;padding:2px 9px;border-radius:999px;
    background:var(--code-bg);color:var(--muted);margin-right:6px}
  .pill.open{background:var(--open-bg);color:var(--open)}
  .pill.draft{background:var(--draft-bg);color:var(--draft)}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px;margin:1.2em 0}
  .card{display:block;text-decoration:none;color:inherit;background:var(--panel);
    border:1px solid var(--line);border-radius:11px;padding:14px 15px;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card b{display:block;font-size:14.5px;margin-bottom:3px}
  .card span{display:block;font-size:12.5px;color:var(--muted);line-height:1.45}
  .card em{display:block;font-style:normal;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent);margin-top:9px;font-weight:650}
  .msg{color:var(--muted);padding:40px 0}
  .msg b{color:var(--ink)}

  @media (max-width:880px){
    .shell{display:block}
    .side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);
      transition:transform .2s ease;width:270px;box-shadow:0 0 40px rgba(0,0,0,.18)}
    body.nav-open .side{transform:none}
    .bar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;
      background:var(--panel);border-bottom:1px solid var(--line);padding:11px 16px}
    .bar button{font:inherit;font-size:20px;line-height:1;background:none;border:0;color:var(--ink);cursor:pointer;padding:4px 6px}
    .bar b{font-size:15px}
    .main{padding:28px 16px 80px}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:none}
    body.nav-open .scrim{display:block}
  }
</style>
</head>
<body>

<div class="bar">
  <button id="burger" aria-label="Menu">☰</button>
  <b>Tapcard Wiki</b>
</div>
<div class="scrim" id="scrim"></div>

<div class="shell">
  <nav class="side" id="side">
    <a class="brand" href="#/docs/start-here.md">
      <b>🎂 Tapcard Wiki</b>
      <span>Human view of the agent docs</span>
    </a>
    <div id="nav"></div>
    <div class="foot">
      Rendered live from the markdown in
      <a href="https://github.com/brianlapp/tap-card-wiki">the repo</a>.
      Agents should read the <code>.md</code> files directly — this page is only a wrapper.
    </div>
  </nav>

  <main class="main">
    <div class="crumb" id="crumb"></div>
    <article class="doc" id="doc"><div class="msg">Loading…</div></article>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const DOCS = [
  { grp:'Start here', items:[
    { p:'docs/start-here.md', t:'Start here', d:'What this is and how to use it' },
    { p:'AGENTS.md',   t:'AGENTS.md',  d:'Agent entry point — rules & doc map' },
    { p:'README.md',   t:'README',     d:'What this repo is' },
  ]},
  { grp:'Wiki', items:[
    { p:'docs/index.md',       t:'Doc index',   d:'Every doc, with status' },
    { p:'docs/conventions.md', t:'Conventions', d:'How to write docs here' },
  ]},
  { grp:'Product', items:[
    { p:'docs/product/scope.md', t:'Scope', d:'What we build, stack, phases' },
  ]},
  { grp:'Research', items:[
    { p:'docs/research/competitive-landscape.md', t:'Competitive landscape', d:'Who we are up against' },
  ]},
  { grp:'Tasks', items:[
    { p:'docs/tasks/README.md', t:'Task catalogue', d:'526 tasks — how to query' },
    { p:'docs/tasks/legend.md', t:'Legend',         d:'Columns and code tables' },
  ]},
  { grp:'Decisions', items:[
    { p:'docs/decisions/0001-source-of-truth.md', t:'0001 · Source of truth', d:'Which project is authoritative' },
    { p:'docs/decisions/0002-pricing-model.md',  t:'0002 · Pricing model',   d:'One-off vs subscription' },
    { p:'docs/decisions/0003-task-catalogue-source.md', t:'0003 · Task catalogue', d:'Repo is the task list' },
  ]},
];

const navEl = document.getElementById('nav');
DOCS.forEach(g => {
  navEl.insertAdjacentHTML('beforeend', `<div class="grp">${g.grp}</div>`);
  g.items.forEach(i => {
    navEl.insertAdjacentHTML('beforeend',
      `<a class="nav" data-p="${i.p}" href="#/${i.p}">${i.t}<small>${i.d}</small></a>`);
  });
});

marked.setOptions({ gfm:true, breaks:false });

const ALL = DOCS.flatMap(g => g.items.map(i => i.p));
const docEl = document.getElementById('doc');
const crumbEl = document.getElementById('crumb');

// Turn "**Status:** Open" / "**Updated:** ..." header lines into pills.
function pillify(html){
  return html.replace(/<p>((?:<strong>(?:Status|Updated|Owner|Date|Deciders|Researched|Method):<\/strong>[^<]*(?:<br>)?\s*)+)<\/p>/g, (m, block) => {
    const rows = block.split(/<br>\s*/).filter(Boolean);
    let out = '<p>';
    rows.forEach(r => {
      const k = (r.match(/<strong>(\w+):<\/strong>/)||[])[1];
      const v = r.replace(/<strong>\w+:<\/strong>\s*/,'').trim();
      if (!k) return;
      if (k === 'Status') {
        const cls = /open/i.test(v) ? 'open' : /draft/i.test(v) ? 'draft' : '';
        out += `<span class="pill ${cls}">${v}</span>`;
      } else {
        out += `<span class="pill">${k}: ${v}</span>`;
      }
    });
    return out + '</p>';
  });
}

function cards(){
  let h = '<h2>Everything in here</h2><div class="cards">';
  DOCS.forEach(g => g.items.forEach(i => {
    if (i.p === 'docs/start-here.md') return;
    h += `<a class="card" href="#/${i.p}"><b>${i.t}</b><span>${i.d}</span>
          <em>${g.grp}</em></a>`;
  }));
  return h + '</div>';
}

async function route(){
  let path = decodeURIComponent(location.hash.replace(/^#\/?/, '')) || 'docs/start-here.md';
  if (!ALL.includes(path)) path = 'docs/start-here.md';

  document.querySelectorAll('a.nav').forEach(a =>
    a.classList.toggle('on', a.dataset.p === path));

  crumbEl.innerHTML = `<a class="raw" href="/${path}">raw .md ↗</a>${path}`;
  docEl.innerHTML = '<div class="msg">Loading…</div>';

  try {
    const r = await fetch('/' + path, { cache:'no-cache' });
    if (!r.ok) throw new Error(r.status);
    docEl.innerHTML = pillify(marked.parse(await r.text()));
    if (path === 'docs/start-here.md') docEl.insertAdjacentHTML('beforeend', cards());
  } catch (e) {
    docEl.innerHTML = `<div class="msg"><b>Couldn't load ${path}</b><br>
      Try the raw file: <a href="/${path}">/${path}</a></div>`;
  }
  document.body.classList.remove('nav-open');
  window.scrollTo(0,0);
}

addEventListener('hashchange', route);
route();

const close = () => document.body.classList.remove('nav-open');
document.getElementById('burger').onclick = () => document.body.classList.toggle('nav-open');
document.getElementById('scrim').onclick = close;
</script>
</body>
</html>
